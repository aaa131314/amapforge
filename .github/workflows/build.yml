name: Build AMap Forge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang lld make curl ca-certificates git \
            libplist-dev libssl-dev zlib1g-dev \
            unzip xz-utils fakeroot dpkg-dev 2>&1 | tail -3
          echo "clang: $(clang --version | head -1)"

      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src
          cd /tmp/ldid-src
          make -j4 2>&1 | tail -3
          sudo cp ldid /usr/local/bin/ 2>/dev/null || true
          echo "ldid: $(which ldid || echo MISSING)"

      - name: Download iOS SDK
        run: |
          mkdir -p /tmp/sdk
          cd /tmp/sdk
          curl -fL --retry 3 -o sdk.tar.gz \
            "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master"
          tar xzf sdk.tar.gz --strip-components=1
          rm -f sdk.tar.gz
          SDK=$(ls -d iPhoneOS*.sdk | sort -V | tail -1)
          echo "SELECTED_SDK=$SDK" >> $GITHUB_ENV
          echo "SDK: $SDK"

      - name: Download frida-core devkit
        run: |
          mkdir -p /tmp/frida
          cd /tmp/frida
          curl -fL --retry 3 --max-time 900 -o devkit.tar.xz \
            "https://github.com/frida/frida/releases/download/17.24.3/frida-core-devkit-17.24.3-ios-arm64.tar.xz"
          tar -xf devkit.tar.xz
          ls -la
          echo "FRIDA_DIR=/tmp/frida" >> $GITHUB_ENV

      - name: Build with frida-core
        run: |
          set +e
          SDK="/tmp/sdk/${SELECTED_SDK}"
          FRIDA="/tmp/frida"
          mkdir -p build/AMapForge.app

          for f in forge_utdid.js wipe_std.js wipe_deep.js wipe_size.js; do
            cp "$f" build/AMapForge.app/ 2>/dev/null || echo "WARN: $f missing"
          done
          cp Info.plist build/AMapForge.app/

          CFLAGS="-target arm64-apple-ios14.0 -isysroot $SDK -fobjc-arc -O1 -I. -I$FRIDA"

          echo "=== compile main.m ==="
          clang $CFLAGS -c main.m -o build/main.o 2>&1 | tail -20
          echo "=== compile RootViewController.m ==="
          clang $CFLAGS -c RootViewController.m -o build/rvc.o 2>&1 | tail -20
          echo "=== compile ForgeRunner.m ==="
          clang $CFLAGS -c ForgeRunner.m -o build/fr.o 2>&1 | tail -40
          echo "=== link ==="
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" -fuse-ld=lld \
                -framework UIKit -framework Foundation \
                -framework CoreFoundation -framework CoreGraphics \
                -framework Security -framework CFNetwork \
                build/main.o build/rvc.o build/fr.o \
                "$FRIDA/libfrida-core.a" \
                -lbsm -ldl -lm -lresolv \
                -o build/AMapForge.app/AMapForge 2>&1 | tail -40

          ls -la build/AMapForge.app/ 2>/dev/null || true

          {
            echo "### Build output"
            echo '```'
            ls -la build/AMapForge.app/ 2>/dev/null || echo "no app dir"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Package deb
        run: |
          set +e
          APP=build/AMapForge.app
          if [ ! -f "$APP/AMapForge" ]; then
            echo "binary missing, skip packaging"
            echo "### package skipped (no binary)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          /usr/local/bin/ldid -S "$APP/AMapForge" 2>&1 | head -3 || echo "ldid skipped"

          ROOT=build/pkg
          mkdir -p "$ROOT/var/jb/Applications"
          cp -R "$APP" "$ROOT/var/jb/Applications/"
          chmod 755 "$ROOT/var/jb/Applications/AMapForge.app/AMapForge"
          mkdir -p "$ROOT/DEBIAN"
          {
            echo "Package: com.local.amapforge"
            echo "Name: AMap Forge"
            echo "Version: 2.0.6"
            echo "Architecture: iphoneos-arm64"
            echo "Description: AMap device identity switcher (offline, built-in frida)."
            echo "Maintainer: local"
            echo "Author: local"
            echo "Section: Utilities"
            echo "Priority: optional"
          } > "$ROOT/DEBIAN/control"

          dpkg-deb -Zxz -z9 --build --root-owner-group "$ROOT" /tmp/out.deb 2>&1 | tail -3
          mkdir -p dist
          cp /tmp/out.deb "dist/com.local.amapforge_2.0.6_iphoneos-arm64.deb"
          ls -la dist/
          du -sh "$APP" 2>/dev/null || true
          echo "### packaged ok" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amapforge-deb
          path: dist/*.deb
          if-no-files-found: warn
