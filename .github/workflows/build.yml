name: Build AMap Forge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang lld make git curl ca-certificates \
            libplist-utils libssl-dev libxml2-dev zlib1g-dev \
            unzip xz-utils fakeroot dpkg-dev 2>&1 | tail -3
          echo "--- versions ---"
          clang --version | head -2
          dpkg-deb --version | head -1

      - name: Install ldid
        run: |
          set -x
          # 从 Procursus 取 ldid（Linux 上给 iOS 二进制做伪签名）
          curl -fL --retry 3 -o /tmp/ldid.deb \
            "http://apt.procurs.us/pool/main/linux-amd64/ldid/ldid_2.1.5-procursus7_linux-amd64.deb" || true
          if [ -f /tmp/ldid.deb ]; then
            dpkg-deb -x /tmp/ldid.deb /tmp/ldid-extract 2>/dev/null || true
            find /tmp/ldid-extract -name ldid -type f -exec sudo cp {} /usr/local/bin/ \;
            sudo chmod +x /usr/local/bin/ldid 2>/dev/null || true
          fi
          if ! command -v ldid >/dev/null; then
            echo "fallback: build ldid from source"
            sudo apt-get install -y -qq libplist-dev libssl-dev 2>/dev/null || true
            git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src || true
            if [ -d /tmp/ldid-src ]; then
              cd /tmp/ldid-src && make -j4 2>&1 | tail -5 || true
              sudo cp ldid /usr/local/bin/ 2>/dev/null || true
            fi
          fi
          ldid -h 2>&1 | head -2 || echo "ldid still missing"

      - name: Clone Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download iOS SDKs
        run: |
          cd $THEOS/sdks
          curl -fL --retry 3 -o sdk.tar.gz \
            "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master"
          tar xzf sdk.tar.gz --strip-components=1
          rm -f sdk.tar.gz
          echo "--- SDKs ---"
          ls -d iPhoneOS*.sdk

      - name: Show environment
        run: |
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          ls $THEOS/bin | head
          which ldid || echo "NO LDID"
          ls $THEOS/sdks | head -3

      - name: Build package
        run: |
          set -o pipefail
          cd theos-app
          make clean 2>&1 | tail -5 || true
          echo "=========== BUILD START ==========="
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tee /tmp/build.log
          echo "=========== BUILD END (rc=$?) ==========="
          exit 0

      - name: Collect debs
        run: |
          mkdir -p /tmp/out
          find . -name "*.deb" -exec cp {} /tmp/out/ \; 2>/dev/null || true
          ls -la /tmp/out/ || echo "no deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: amapforge-deb
          path: /tmp/out/*.deb
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
