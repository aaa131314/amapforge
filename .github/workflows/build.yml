name: Build AMap Forge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz || true

      - name: Clone Theos
        run: |
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download iOS SDKs
        run: |
          cd $THEOS/sdks
          curl -sL -o sdk.tar.xz "https://github.com/theos/sdks/archive/master.tar.gz"
          tar xzf sdk.tar.gz --strip-components=1
          rm -f sdk.tar.gz
          ls -d iPhoneOS*.sdk | head -5

      - name: Build package
        run: |
          cd theos-app
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: List output
        run: |
          find . -name "*.deb" -o -name "*.dylib" | head -20

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: amapforge-deb
          path: "**/*.deb"
          if-no-files-found: warn
