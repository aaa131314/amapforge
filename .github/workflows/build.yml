name: Build AMap Forge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang lld make git curl \
            libplist-utils libssl-dev libxml2-dev \
            libc6-dev libstdc++-12-dev zlib1g-dev \
            unzip xz-utils ldid 2>/dev/null || true
          echo "--- versions ---"
          clang --version | head -2
          make --version | head -1
          (ldid -h 2>&1 | head -1) || echo "ldid not installed"

      - name: Clone Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download iOS SDKs
        run: |
          cd $THEOS/sdks
          set -x
          # codeload 直链，避免 archive/ 跳转到 Azure 导致的认证错误
          curl -fL --retry 3 --retry-delay 2 \
            -o sdk.tar.gz \
            "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master" \
          || curl -fL --retry 3 \
            -o sdk.tar.gz \
            "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz"
          ls -la sdk.tar.gz
          tar xzf sdk.tar.gz --strip-components=1
          rm -f sdk.tar.gz
          echo "--- SDKs ---"
          ls -d iPhoneOS*.sdk 2>/dev/null | head -8

      - name: Show Theos env
        run: |
          echo "THEOS=$THEOS"
          ls $THEOS/bin | head -10
          ls $THEOS/toolchain 2>/dev/null || echo "(no bundled toolchain)"

      - name: Build package
        run: |
          cd theos-app
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -60

      - name: Collect debs
        if: always()
        run: |
          mkdir -p /tmp/out
          find . -name "*.deb" -exec cp {} /tmp/out/ \; 2>/dev/null || true
          ls -la /tmp/out/ || echo "no deb produced"

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amapforge-deb
          path: /tmp/out/*.deb
          if-no-files-found: warn
