name: Build AMap Forge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang lld make curl ca-certificates git \
            libplist-dev libssl-dev zlib1g-dev \
            unzip xz-utils fakeroot dpkg-dev 2>&1 | tail -3
          echo "clang: $(clang --version | head -1)"
          echo "dpkg-deb: $(dpkg-deb --version | head -1)"

      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src
          cd /tmp/ldid-src
          make -j4 2>&1 | tail -5
          sudo cp ldid /usr/local/bin/
          echo "ldid installed: $(which ldid)"

      - name: Download iOS SDK
        run: |
          mkdir -p /tmp/sdk
          cd /tmp/sdk
          curl -fL --retry 3 -o sdk.tar.gz \
            "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master"
          tar xzf sdk.tar.gz --strip-components=1
          rm -f sdk.tar.gz
          ls -d iPhoneOS*.sdk
          SDK=$(ls -d iPhoneOS*.sdk | sort -V | tail -1)
          echo "SELECTED_SDK=$SDK" >> $GITHUB_ENV
          echo "SDK path: /tmp/sdk/$SDK"

      - name: Compile binary
        run: |
          set +e
          SDK="/tmp/sdk/${SELECTED_SDK}"
          echo "=== using SDK: $SDK ==="
          mkdir -p build/AMapForge.app

          CFLAGS="-target arm64-apple-ios14.0 -isysroot $SDK -fobjc-arc -O2 -I."

          echo "=== compile main.m ==="
          clang $CFLAGS -c main.m -o build/main.o 2>&1 | tee /tmp/c1.log
          echo "rc1=$?"

          echo "=== compile RootViewController.m ==="
          clang $CFLAGS -c RootViewController.m -o build/rvc.o 2>&1 | tee /tmp/c2.log
          echo "rc2=$?"

          echo "=== compile ForgeRunner.m ==="
          clang $CFLAGS -c ForgeRunner.m -o build/fr.o 2>&1 | tee /tmp/c3.log
          echo "rc3=$?"

          echo "=== link ==="
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" \
                -fuse-ld=lld \
                -framework UIKit -framework Foundation \
                build/main.o build/rvc.o build/fr.o \
                -o build/AMapForge.app/AMapForge 2>&1 | tee /tmp/link.log
          rclink=$?
          echo "rclink=$rclink"
          if [ $rclink -ne 0 ] || [ ! -f build/AMapForge.app/AMapForge ]; then
            echo "=== retry with ld64.lld directly ==="
            LD64=$(command -v ld64.lld || command -v ld.lld || echo "")
            echo "ld64.lld: $LD64"
            if [ -n "$LD64" ]; then
              $LD64 -arch arm64 \
                -platform_version ios 14.0 14.0 \
                -syslibroot "$SDK" \
                -framework UIKit -framework Foundation \
                -o build/AMapForge.app/AMapForge \
                build/main.o build/rvc.o build/fr.o 2>&1 | tee -a /tmp/link.log
              echo "ld64 rc=$?"
            fi
          fi
          ls -la build/AMapForge.app/ || true

          ls -la build/AMapForge.app/ || echo "no app dir"

          {
            echo "### Compile logs"
            echo '```'
            echo "--- c1 ---"; tail -30 /tmp/c1.log 2>/dev/null
            echo "--- c2 ---"; tail -30 /tmp/c2.log 2>/dev/null
            echo "--- c3 ---"; tail -30 /tmp/c3.log 2>/dev/null
            echo "--- link ---"; tail -30 /tmp/link.log 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Package app
        run: |
          set +e
          APP=build/AMapForge.app
          if [ ! -f "$APP/AMapForge" ]; then
            echo "binary missing, cannot package"
            echo "### package: binary missing" >> $GITHUB_STEP_SUMMARY
            ls -la build/ || true
            exit 0
          fi

          cp Info.plist "$APP/"
          /usr/local/bin/ldid -S "$APP/AMapForge" 2>&1 | head -5
          echo "signed ok"

          ROOT=build/pkg
          mkdir -p "$ROOT/var/jb/Applications"
          cp -R "$APP" "$ROOT/var/jb/Applications/"
          mkdir -p "$ROOT/DEBIAN"
          {
            echo "Package: com.local.amapforge"
            echo "Name: AMap Forge"
            echo "Version: 1.0.0"
            echo "Architecture: iphoneos-arm64"
            echo "Description: AMap device identity switcher."
            echo "Maintainer: local"
            echo "Author: local"
            echo "Section: Utilities"
            echo "Priority: optional"
          } > "$ROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$ROOT" /tmp/out.deb 2>&1 | tail -5
          ls -la /tmp/out.deb
          mkdir -p dist
          cp /tmp/out.deb "dist/com.local.amapforge_1.0.0_iphoneos-arm64.deb"
          ls -la dist/
          echo "### package done" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amapforge-deb
          path: dist/*.deb
          if-no-files-found: warn
